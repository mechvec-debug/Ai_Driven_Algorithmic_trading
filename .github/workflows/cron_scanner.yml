# .github/workflows/cron_scanner.yml
name: Automated NSE/BSE Quantitative Daily Scanner

on:
  schedule:
    # Triggers Monday through Friday at 11:00 AM UTC (which maps directly to 4:30 PM IST after market hours)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub website whenever you want

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clone Current Repository Context
      uses: actions/checkout@v4

    - name: 2. Set Up Virtual Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. Install Open-Source Pipeline Libraries
      run: |
        python -m pip install --upgrade pip
        pip install openbb openbb-yfinance yfinance pandas numpy pyyaml requests

    - name: 4. Execute Main Analytics Core Engine
      env:
        # Securely inject your Telegram secrets from your GitHub Settings panel
        TELEGRAM_BOT_TOKEN: ${{ secrets.8899515831:AAFLbDwp0sk6K9Q6C_IGOSuRpltx92_ssPM }}
        TELEGRAM_CHAT_ID: ${{ secrets.5162645225 }}
      run: |
        python main.py

    - name: 5. Commit and Push Overwritten JSON Signal Data File
      run: |
        git config --global user.name "GitHub Automation Runner"
        git config --global user.email "actions@github.com"
        git add data/output/latest_market_signals.json
        # Only commits and pushes if changes exist to avoid empty runtime build loops
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Overwrite: Latest Market Signals [Skip CI]" && git push)
