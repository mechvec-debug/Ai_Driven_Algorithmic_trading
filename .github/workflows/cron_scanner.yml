
# .github/workflows/cron_scanner.yml
name: Automated NSE/BSE Quantitative Daily Scanner

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch: 

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    
    # FIX: Add these explicit lines to grant write permissions to the automation bot
    permissions:
      contents: write
    
    steps:
    - name: 1. Clone Current Repository Context
      uses: actions/checkout@v4
# ... (Leave the remaining steps below exactly as they are)

    - name: 2. Set Up Virtual Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. Install Open-Source Pipeline Libraries
      run: |
        python -m pip install --upgrade pip
        pip install openbb openbb-yfinance yfinance pandas numpy pyyaml requests

    - name: 4. Execute Main Analytics Core Engine
      env:
        # Securely inject your Telegram secrets from your GitHub Settings panel
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    - name: 5. Configure Git Credentials
      run: |
        git config --global user.name "GitHub Automation Runner"
        git config --global user.email "actions@github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

    - name: 6. Commit and Push Overwritten JSON Signal Data File
      run: |
        git config --global user.name "GitHub Automation Runner"
        git config --global user.email "actions@github.com"
        git add data/output/latest_market_signals.json
        # FIX: Added --force to ensure the cloud runner instantly overrides history mismatches
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Overwrite: Latest Market Signals [Skip CI]" && git push --force origin main)
