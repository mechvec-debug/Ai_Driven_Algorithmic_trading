# .github/workflows/cron_scanner.yml
name: Automated NSE/BSE Quantitative Daily Scanner

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch: 

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: 1. Clone Current Repository Context
      uses: actions/checkout@v4

    - name: 2. Set Up Virtual Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. Install Open-Source Pipeline Libraries
      run: |
        python -m pip install --upgrade pip
        pip install openbb openbb-yfinance yfinance pandas numpy pyyaml requests

    - name: 4. Execute Main Analytics Core Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    - name: 5. Securely Auto-Commit Overwritten Data Matrices
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated Overwrite: Latest Market Signals [Skip CI]"
        file_pattern: 'data/output/latest_market_signals.json'
        disable_git_pushing: false
