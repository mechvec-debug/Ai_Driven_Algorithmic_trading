# .github/workflows/cron_scanner.yml
name: Automated NSE/BSE Quantitative Daily Scanner

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch: 

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: 1. Clone Current Repository Context
      uses: actions/checkout@v4

    - name: 2. Set Up Virtual Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. Install Open-Source Pipeline Libraries
      run: |
        python -m pip install --upgrade pip
        # 🟢 UPGRADED: Added matplotlib to prevent the ModuleNotFoundError crash
        pip install openbb openbb-yfinance yfinance pandas numpy pyyaml requests matplotlib pillow

    - name: 4. Execute Main Analytics Core Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    # 🔍 Locate Step 5 inside your workflow file and verify it looks exactly like this:
    - name: 5. Securely Auto-Commit Overwritten Data Matrices
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated Overwrite: Latest Market Signals and Alert History [Skip CI]"
        
    - name: 6. Commit and Push Overwritten JSON Signal Data File
      run: |
        git config --global user.name "GitHub Automation Runner"
        git config --global user.email "actions@github.com"
        git add data/output/latest_market_signals.json
        # FIX: Added --force to ensure the cloud runner instantly overrides history mismatches
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Overwrite: Latest Market Signals [Skip CI]" && git push --force origin main)

    
        # 🟢 CRITICAL TRACKING SYNC: Both targets must be declared in one space-separated string
        file_pattern: 'data/output/latest_market_signals.json data/output/alert_history.json'
    
