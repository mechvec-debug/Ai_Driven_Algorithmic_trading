# .github/workflows/cron_scanner.yml
name: Automated NSE/BSE Quantitative Daily Scanner

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST (UTC+5:30), Monday-Friday.
    # GitHub Actions schedules always run in UTC and can be queued a few
    # minutes to (occasionally) a couple of hours late during busy periods —
    # that's a platform-level delay, not something this cron expression controls.
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: 1. Clone Current Repository Context
      uses: actions/checkout@v4

    - name: 2. Set Up Virtual Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. Install Open-Source Pipeline Libraries
      run: |
        python -m pip install --upgrade pip
        # 🟢 UPGRADED: Added matplotlib to prevent the ModuleNotFoundError crash
        pip install openbb openbb-yfinance yfinance pandas numpy pyyaml requests matplotlib pillow

    - name: 3b. Build OpenBB Extension Router Map
      # OpenBB generates its obb.equity / obb.economy / etc. routers on first import in a
      # fresh environment (the "Extensions to add: ... Building..." message you saw at the
      # tail of Step 4's log). That build has to finish AND be picked up by a new Python
      # process before those attributes exist — if main.py's own `from openbb import obb`
      # is the process that triggers the build, it races the build and loses, which is why
      # every ticker failed with "'App' object has no attribute 'equity'". Running the
      # import here, in its own throwaway step, lets the build finish first so main.py's
      # process (started fresh in Step 4) picks up the already-built routers.
      run: |
        python -c "import openbb"

    - name: 4. Execute Main Analytics Core Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    # Single commit/push step. No file_pattern is set on purpose: the default
    # ('.') picks up every file main.py touched this run — the signals JSON,
    # the alert cooldown state, the live portfolio ledger, and the per-ticker
    # data/processed/*.csv files the dashboard's chart reads. Narrowing
    # file_pattern to just the JSON files would silently stop those CSVs
    # from being committed and break the chart.
    - name: 5. Securely Auto-Commit Overwritten Data Matrices
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated Overwrite: Latest Market Signals and Alert History [Skip CI]"
