# .github/workflows/run_broker.yml
name: Morning Institutional Broker Execution Agent

on:
  schedule:
    # 🕒 Runs automatically every Monday to Friday at 03:35 AM UTC (9:05 AM IST)
    - cron: '35 3 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually from your phone via GitHub app/website

jobs:
  execute-broker-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: 1. Clone Current Repository Context
      uses: actions/checkout@v4

    - name: 2. Set Up Virtual Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. Install Open-Source Core Libraries
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy

    - name: 4. Execute Morning Portfolio Matrix Simulator
      run: |
        python broker_agent.py

    - name: 5. Securely Auto-Commit Updated Investment Ledger
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated Ledger Update: Morning Orders Processed [Skip CI]"
        # 🟢 Tracks and saves the updated active positions ledger file to your repository
        file_pattern: 'data/output/live_portfolio_ledger.json'
        disable_git_pushing: false
